    <div class = section1>
        <form method = "post" onsubmit="handleLogin(event)">

            <p class = "formGroup">
                <label for ="username">Username/Email : </label> <br>
                <input type ="text" id = "username" name = "username" required>
            </p>

            <p class = "formGroup">
                <label for ="password">Password : </label> <br>
                <input type ="text" id = "password" name = "password" required>
            </p>

            <p class = "formGroup">
                <button type ="submit" class="btn" > Log In </button>
                <button type ="reset" class="btn" > Reset </button>
            </p>

            <p class = "loginOptions">
                <a href="signUp.html"> Don't have an account? Create a new account </a>
                <a href="help.html"> Forgot Password </a>
            </p>

<script>
        function handleLogin(event) {
            event.preventDefault();

            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value;

            if (!usernameInput || !passwordInput) {
                alert('Please enter both your username/email and password.');
                return;
            }

            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('currentUser', usernameInput);

            alert('Login successful! Redirecting to your dashboard...');
            window.location.href = 'login.html';
        }
    </script>
